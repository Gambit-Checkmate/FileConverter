name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      gui: ${{ steps.changes.outputs.gui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: changes
        run: node scripts/ci-changes.mjs
      - run: npm run test:automation

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --workspace=packages/core
      - run: npm run lint --workspace=packages/core
      - run: npm run build --workspace=packages/core
      - name: Unit, integration, E2E, and coverage
        run: npm run test:coverage --workspace=packages/core
      - uses: actions/upload-artifact@v7
        if: matrix.node == '22'
        with:
          name: core-coverage-report
          path: packages/core/coverage/
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  cli-package:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win-x64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --workspace=packages/core
      - run: npm run build --workspace=packages/core
      - name: Build locked standalone CLI and npm package
        run: npm run package:cli
      - name: Record source commit and checksums
        run: npm run artifact:record -- cli artifacts/cli-${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: artifacts/cli-${{ matrix.platform }}/
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  gui-package:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win-x64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test --workspace=@fileconverter/gui
      - run: npm run make --workspace=@fileconverter/gui
      - name: Install and test the Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-Item packages/gui/out/installers/*-win-x64.exe
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/fileconverter-desktop'
          $process = Start-Process $installer.FullName -ArgumentList '/S' -PassThru
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          while (!$process.WaitForExit(30000)) {
            $files = @(Get-ChildItem $installed -File -Recurse -ErrorAction SilentlyContinue).Count
            Write-Host "Installing: $files files after $([int]$timer.Elapsed.TotalSeconds)s"
            if ($timer.Elapsed.TotalMinutes -ge 10) { throw 'Installer timed out after 10 minutes' }
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (!(Test-Path "$installed/FileConverter.exe")) { throw 'Installed executable missing' }
          if (!(Test-Path "$installed/Uninstall FileConverter.exe")) { throw 'Uninstaller missing' }
          $shortcuts = Get-ChildItem "$env:APPDATA/Microsoft/Windows/Start Menu/Programs" -Filter 'FileConverter.lnk' -Recurse
          if (!$shortcuts) { throw 'Start menu shortcut missing' }
          node scripts/smoke-installed-desktop.mjs "$installed/resources/app"
          node scripts/smoke-desktop-launch.mjs "$installed/FileConverter.exe"
      - name: Mount and test the macOS application
        if: runner.os == 'macOS'
        run: |
          mount="$RUNNER_TEMP/fileconverter-dmg"
          mkdir -p "$mount"
          hdiutil attach packages/gui/out/installers/*.dmg -mountpoint "$mount" -nobrowse
          trap 'hdiutil detach "$mount"' EXIT
          test -L "$mount/Applications"
          cp -R "$mount/FileConverter.app" "$RUNNER_TEMP/FileConverter.app"
          node scripts/smoke-installed-desktop.mjs "$RUNNER_TEMP/FileConverter.app/Contents/Resources/app"
          node scripts/smoke-desktop-launch.mjs "$RUNNER_TEMP/FileConverter.app/Contents/MacOS/FileConverter"
      - name: Install and test the Linux application
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./packages/gui/out/installers/*.deb
          test -f /usr/share/applications/no.marentius.fileconverter.desktop
          node scripts/smoke-installed-desktop.mjs /opt/FileConverter/resources/app
          xvfb-run -a node scripts/smoke-desktop-launch.mjs /opt/FileConverter/FileConverter
          mkdir -p "$RUNNER_TEMP/appimage"
          cd "$RUNNER_TEMP/appimage"
          "$GITHUB_WORKSPACE"/packages/gui/out/installers/*.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          cd "$GITHUB_WORKSPACE"
          node scripts/smoke-installed-desktop.mjs "$RUNNER_TEMP/appimage/squashfs-root/resources/app"
      - name: Record source commit and checksums
        run: npm run artifact:record -- gui artifacts/gui-${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.platform }}
          path: artifacts/gui-${{ matrix.platform }}/
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  ci:
    name: CI
    needs: [changes, core, cli-package, gui-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all affected products to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.RESULTS);
            if (jobs.changes.result !== "success" || Object.values(jobs).some(j => !["success", "skipped"].includes(j.result))) process.exit(1);
            const required = { core: jobs.changes.outputs.core, "cli-package": jobs.changes.outputs.core, "gui-package": jobs.changes.outputs.gui };
            if (Object.entries(required).some(([job, affected]) => affected === "true" && jobs[job].result !== "success")) process.exit(1);
          '
