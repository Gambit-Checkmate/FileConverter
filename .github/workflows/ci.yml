name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      gui: ${{ steps.changes.outputs.gui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: changes
        run: node scripts/ci-changes.mjs
      - run: npm run test:automation

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --workspace=packages/core
      - run: npm run lint --workspace=packages/core
      - run: npm run build --workspace=packages/core
      - name: Unit, integration, E2E, and coverage
        run: npm run test:coverage --workspace=packages/core
      - uses: actions/upload-artifact@v7
        if: matrix.node == '22'
        with:
          name: core-coverage-report
          path: packages/core/coverage/
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  cli-package:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win-x64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --workspace=packages/core
      - run: npm run build --workspace=packages/core
      - name: Build locked standalone CLI and npm package
        run: npm run package:cli
      - name: Record source commit and checksums
        run: npm run artifact:record -- cli artifacts/cli-${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: artifacts/cli-${{ matrix.platform }}/
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  gui-package:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win-x64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test --workspace=@fileconverter/gui
      - run: npm run make --workspace=@fileconverter/gui
      - name: Record source commit and checksums
        run: npm run artifact:record -- gui artifacts/gui-${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.platform }}
          path: artifacts/gui-${{ matrix.platform }}/
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  ci:
    name: CI
    needs: [changes, core, cli-package, gui-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all affected products to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.RESULTS);
            if (jobs.changes.result !== "success" || Object.values(jobs).some(j => !["success", "skipped"].includes(j.result))) process.exit(1);
            const required = { core: jobs.changes.outputs.core, "cli-package": jobs.changes.outputs.core, "gui-package": jobs.changes.outputs.gui };
            if (Object.entries(required).some(([job, affected]) => affected === "true" && jobs[job].result !== "success")) process.exit(1);
          '
