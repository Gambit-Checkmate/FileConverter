name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# Serialize release planning/publication; never cancel an in-flight publish.
concurrency:
  group: releases-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    outputs:
      cli_created: ${{ steps.release.outputs['packages/core--release_created'] }}
      cli_tag: ${{ steps.release.outputs['packages/core--tag_name'] }}
      gui_created: ${{ steps.release.outputs['packages/gui--release_created'] }}
      gui_tag: ${{ steps.release.outputs['packages/gui--tag_name'] }}
    steps:
      - name: Only plan releases from the current validated main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$head" = "$TESTED_SHA" ]; then echo 'current=true' >> "$GITHUB_OUTPUT"; fi
      - uses: googleapis/release-please-action@v4
        id: release
        if: steps.current.outputs.current == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish-cli:
    needs: release-please
    if: needs.release-please.outputs.cli_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.cli_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Find successful CI for the release tag's exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci.mjs
      - name: Download the tested CLI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ steps.ci.outputs.run }}
        run: gh run download "$CI_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'cli-*' --dir artifacts
      - name: Verify all platforms, versions, source commit, and checksums
        env:
          CI_SHA: ${{ steps.ci.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.cli_tag }}
        run: node scripts/artifacts.mjs verify-release cli artifacts
      - name: Upload tested CLI downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.cli_tag }}
        run: |
          node -e 'const {execFileSync}=require("node:child_process"); for(const file of require("./artifacts/cli-files.json")) execFileSync("gh", ["release", "upload", process.env.RELEASE_TAG, file, "--clobber"], {stdio:"inherit"});'
      - name: Enable npm trusted publishing
        run: npm install -g npm@latest
      - name: Publish the verified npm tarball with provenance
        run: npm run publish:verified
      - name: Publish the complete CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.cli_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest=false --title "FileConverter CLI ${RELEASE_TAG#fileconverter-}"

  publish-gui:
    needs: release-please
    if: needs.release-please.outputs.gui_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.gui_tag }}
      - name: Find successful CI for the release tag's exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci.mjs
      - name: Download the tested desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ steps.ci.outputs.run }}
        run: gh run download "$CI_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'gui-*' --dir artifacts
      - name: Verify all platforms, versions, source commit, and checksums
        env:
          CI_SHA: ${{ steps.ci.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.gui_tag }}
        run: node scripts/artifacts.mjs verify-release gui artifacts
      - name: Upload tested desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.gui_tag }}
        run: |
          node -e 'const {execFileSync}=require("node:child_process"); for(const file of require("./artifacts/gui-files.json")) execFileSync("gh", ["release", "upload", process.env.RELEASE_TAG, file, "--clobber"], {stdio:"inherit"});'
      - name: Publish the complete desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.gui_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --title "FileConverter Desktop ${RELEASE_TAG#gui-}"
